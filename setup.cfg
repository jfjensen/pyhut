[metadata]
name = pyhut
version = 0.1.0
description = Bare-metal, hardware-agnostic control library for a differential-drive robot (Duckiebot HUT v3.1 on a Jetson Nano).
long_description = file: README.md
long_description_content_type = text/markdown
author = Jes Fink-Jensen
license = MIT
keywords = duckiebot, duckietown, jetson-nano, robot, i2c, gpio, differential-drive
classifiers =
    Programming Language :: Python :: 3
    Operating System :: POSIX :: Linux
    License :: OSI Approved :: MIT License
    Topic :: System :: Hardware :: Hardware Drivers
    Intended Audience :: Developers

[options]
python_requires = >=3.6
zip_safe = False
packages = pyhut
package_dir =
    pyhut = .

[options.package_data]
pyhut = LICENSE, NOTICES, README.md

[options.entry_points]
console_scripts =
    pyhut-demo = pyhut.demo:main
    pyhut-calibrate = pyhut.calibrate:main
    pyhut-battery = pyhut.battery:main